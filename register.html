<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Complainify</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <a href="index.html">Complainify</a>
    </div>

    <div class="nav-buttons">
        <a href="index.html" class="btn btn-outline">Home</a>
        <a href="login.html" class="btn btn-primary">Login</a>
    </div>

</header>


<main class="auth-container">

    <div class="auth-card">

        <div class="badge">
            Create Account
        </div>

        <h1>Register</h1>

        <p class="auth-subtitle">
            Create your Complainify account to submit and track complaints.
        </p>


        <form id="registerForm" autocomplete="off">

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>


            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="off"
                    required
                >
            </div>


            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
            </div>


            <button type="submit" class="btn btn-primary auth-button">
                Create Account
            </button>

        </form>


        <p id="registerMessage" class="message"></p>


        <p class="auth-footer">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</main>


<script type="module" src="js/auth.js"></script>

</body>
</html>
