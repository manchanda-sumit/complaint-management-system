<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Complainify</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">
        <a href="index.html">Complainify</a>
      </div>

      <div class="nav-buttons">
        <a href="index.html" class="btn btn-outline">Home</a>
        <a href="login.html" class="btn btn-primary">Login</a>

        <button
          type="button"
          id="themeToggle"
          class="btn btn-outline theme-toggle"
        >
          ☀️ Light mode
        </button>
      </div>
    </header>

    <main class="auth-container">
      <div class="auth-card">
        <div class="badge">Account Recovery</div>

        <h1>Forgot Password?</h1>

        <p class="auth-subtitle">
          Enter the email address associated with your Complainify account.
          We'll send you a secure link to reset your password.
        </p>

        <form id="forgotPasswordForm" autocomplete="on">
          <div class="form-group">
            <label for="resetEmail">Email Address</label>

            <input
              type="email"
              id="resetEmail"
              placeholder="Enter your registered email"
              autocomplete="email"
              required
            />
          </div>

          <button
            type="submit"
            id="resetPasswordButton"
            class="btn btn-primary auth-button"
          >
            Send Reset Link
          </button>
        </form>

        <p
          id="resetMessage"
          class="message"
          role="status"
          aria-live="polite"
        ></p>

        <p class="auth-footer">
          Remember your password?
          <a href="login.html">Back to Login</a>
        </p>
      </div>
    </main>

    <script type="module" src="js/auth.js"></script>
    <script src="js/theme.js"></script>
  </body>
</html>
